# Render blueprint. Push to GitHub, then New > Blueprint and point it here.
#
# Set LINKEDIN_COOKIE in the Render dashboard (Environment > Secret), never in
# this file -- it is committed.
services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The whole `cookie:` header from a real browser request. Not just li_at:
      # LinkedIn expires the session when a member token arrives without
      # bcookie/bscookie, its device-identity cookies. See the README.
      - key: LINKEDIN_COOKIE
        sync: false          # prompts in the dashboard; never stored in git
      - key: API_KEYS
        sync: false
      - key: REQUIRE_API_KEY
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: MAX_PROFILES_PER_HOUR
        value: "12"
      - key: MAX_PROFILES_PER_DAY
        value: "80"
      - key: MIN_DELAY_SECONDS
        value: "3.0"
      - key: MAX_DELAY_SECONDS
        value: "9.0"
      - key: MAX_PAGINATION_REQUESTS
        value: "8"
      - key: CACHE_ENABLED
        value: "true"    # on for the public demo; see README
      # Retention is a privacy decision: this holds the profile of everyone
      # looked up through the service. 1h fresh, 24h fallback, then deleted.
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: CACHE_STALE_MAX_SECONDS
        value: "86400"
      - key: CACHE_PATH
        value: "/app/data/cache.sqlite3"
      - key: LOG_LEVEL
        value: "INFO"
    # Render's free tier has an ephemeral filesystem, so the cache is lost on
    # redeploy and on cold start. Attach a disk on a paid plan to keep it:
    # disk:
    #   name: cache
    #   mountPath: /app/data
    #   sizeGB: 1
